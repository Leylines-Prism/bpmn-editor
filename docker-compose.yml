# Version auto-hébergée : l'éditeur et son serveur MCP.
#
#   docker compose up -d --build
#   puis ouvrir http://localhost:8080
#
# Clés d'API : dans mcp/.env (voir mcp/README.md), ou saisies dans la fenêtre Options.
# Par défaut, le site n'est joignable que depuis cette machine (127.0.0.1).

services:
  editor:
    build:
      context: .
      args:
        VITE_MCP_BRIDGE_URL: /bridge
        # Lien « Feedback » : à régler dans le fichier .env à côté de ce fichier (voir le README).
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_CONTACT_URL: ${VITE_CONTACT_URL:-}
        FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
    ports:
      - "${BPMN_BIND:-127.0.0.1}:${BPMN_PORT:-8080}:80"
    depends_on:
      - mcp
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    env_file:
      - path: mcp/.env
        required: false
    environment:
      # Pour un autre nom ou une autre adresse (proxy, nom de domaine), voir le README.
      BPMN_EDITOR_ORIGINS: ${BPMN_EDITOR_ORIGINS:-http://localhost:${BPMN_PORT:-8080},http://127.0.0.1:${BPMN_PORT:-8080}}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    # Diagrammes enregistrés sur le serveur (« Mes diagrammes ») : gardés dans ce volume.
    volumes:
      - diagrams:/data
    # Ollama lancé sur la machine hôte : http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  diagrams:
