<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur BPMN · Leylines</title>
  <link rel="icon" href="/design/leylines/assets/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/design/leylines/assets/favicon-white.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/design/leylines/assets/favicon-black.svg" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/design/leylines/assets/favicon-black-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" />
  <script>
    // Applique le thème choisi avant le premier affichage, sans clignotement
    try { const t = localStorage.getItem('bpmn-editor-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
  </script>
</head>
<body>
  <div id="toolbar">
    <div class="brand">
      <img class="only-light" src="/design/leylines/assets/leylines-icon-square-white.svg" alt="Leylines" />
      <img class="only-dark" src="/design/leylines/assets/leylines-icon-square-black.svg" alt="Leylines" />
      <h1>Éditeur BPMN</h1>
    </div>
    <input id="file-name" type="text" value="diagramme" maxlength="120" spellcheck="false" autocomplete="off"
      aria-label="Nom du fichier" title="Nom du fichier pour l'enregistrement et les exports (sans extension)" />
    <button class="btn" id="btn-new" data-icon="new">Nouveau</button>
    <button class="btn" id="btn-open" data-icon="open">Ouvrir</button>
    <button class="btn" id="btn-import-xml" data-icon="code">Importer XML</button>
    <input type="file" id="file-input" accept=".bpmn,.xml" style="display:none" />
    <div class="sep"></div>
    <button class="btn" id="btn-save" data-icon="save">Enregistrer .bpmn</button>
    <button class="btn" id="btn-export" data-icon="image" popovertarget="export-menu" aria-haspopup="menu">Exporter</button>
    <div id="export-menu" class="menu" popover role="menu">
      <button class="btn" id="btn-svg" data-icon="image" role="menuitem">Image SVG</button>
      <button class="btn" id="btn-png" data-icon="image" role="menuitem">Image PNG</button>
      <button class="btn" id="btn-pdf" data-icon="pdf" role="menuitem">Document PDF</button>
    </div>
    <div class="sep"></div>
    <button class="btn" id="btn-layout" data-icon="layout">Ranger</button>
    <button class="btn" id="btn-simulation" data-icon="play">Simulation</button>
    <span id="autosave-status">Sauvegarde auto : —</span>
    <button class="btn icon-only" id="btn-theme" data-icon="theme" title="Thème : auto" aria-label="Thème : auto"></button>
  </div>
  <div id="main">
    <div id="canvas">
      <div id="credit">Powered by <a href="https://bpmn.io" target="_blank">bpmn.io</a></div>
    </div>
    <div id="properties-panel"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
