<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPMN Editor — Leylines</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: #16213e;
      border-bottom: 1px solid #0f3460; flex-shrink: 0;
      flex-wrap: wrap;
    }
    #toolbar h1 { font-size: 14px; font-weight: 600; color: #e94560; margin-right: 8px; white-space: nowrap; }
    .btn {
      padding: 5px 12px; border: 1px solid #0f3460;
      background: #0f3460; color: #e0e0e0;
      border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn:hover { background: #e94560; border-color: #e94560; }
    .btn.active { background: #e94560; border-color: #e94560; }
    .sep { width: 1px; height: 24px; background: #0f3460; margin: 0 4px; }
    #autosave-status { font-size: 11px; color: #888; margin-left: auto; white-space: nowrap; }

    #main { display: flex; flex: 1; overflow: hidden; }
    #canvas { flex: 1; position: relative; background: #fff; }
    /* Le canevas est clair : ses éléments HTML (menu contextuel, saisie de libellé)
       ne doivent pas hériter du texte clair du thème sombre */
    #canvas { color: #1a1a1a; }
    #canvas .djs-context-pad .entry:hover { color: #0066cc; }
    #properties-panel { width: 280px; border-left: 1px solid #0f3460; overflow-y: auto; background: #16213e; flex-shrink: 0; }

    #credit {
      position: absolute; bottom: 8px; left: 8px;
      font-size: 10px; color: #999; z-index: 100;
      background: rgba(255,255,255,0.8); padding: 2px 6px; border-radius: 3px;
    }
    #credit a { color: #555; text-decoration: none; }
    #credit a:hover { text-decoration: underline; }

    /* Fix popup menu bpmn-js — forcer couleurs claires */
    .djs-popup {
      color: #1a1a1a !important;
      background: #ffffff !important;
    }
    .djs-popup .entry {
      color: #1a1a1a !important;
    }
    .djs-popup .entry:hover {
      background: #f0f0f0 !important;
      color: #1a1a1a !important;
    }
    .djs-popup-header .entry {
      color: #1a1a1a !important;
    }
    .djs-popup .search input {
      color: #1a1a1a !important;
      background: #ffffff !important;
    }
    .djs-popup .group-title {
      color: #6b7280 !important;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>📊 BPMN Editor</h1>
    <button class="btn" id="btn-new">🆕 Nouveau</button>
    <button class="btn" id="btn-open">📂 Ouvrir</button>
    <input type="file" id="file-input" accept=".bpmn,.xml" style="display:none" />
    <div class="sep"></div>
    <button class="btn" id="btn-save">💾 Enregistrer .bpmn</button>
    <button class="btn" id="btn-svg">🖼 Export SVG</button>
    <button class="btn" id="btn-png">🖼 Export PNG</button>
    <div class="sep"></div>
    <button class="btn" id="btn-layout">📐 Ranger</button>
    <button class="btn" id="btn-simulation">▶ Simulation</button>
    <span id="autosave-status">Auto-save: —</span>
  </div>
  <div id="main">
    <div id="canvas">
      <div id="credit">Powered by <a href="https://bpmn.io" target="_blank">bpmn.io</a></div>
    </div>
    <div id="properties-panel"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
