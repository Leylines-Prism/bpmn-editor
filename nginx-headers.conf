# En-têtes de sécurité, inclus dans chaque bloc « location ».
# nginx n'hérite pas des add_header du bloc « server » dans un bloc « location » qui a les siens :
# les répéter ici les applique vraiment à toutes les réponses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# La politique complète est dans chaque page (balise meta, posée au build) : frame-ancestors
# n'y est pas lu, il est donc envoyé ici en en-tête.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
