server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution différée du serveur MCP (service « mcp » de docker-compose) : sans lui,
    # l'éditeur démarre quand même et ces adresses répondent 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcp http://mcp:3333;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Serveur MCP : clients MCP (/mcp), onglets de l'éditeur (/bridge), chat intégré (/chat),
    # diagrammes enregistrés (/diagrams).
    # Le nom d'hôte d'origine est transmis : le serveur refuse ceux qu'il ne connaît pas.
    location = /mcp {
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /bridge {
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }
    # Mes diagrammes enregistrés sur le serveur (10 Mo au plus par diagramme).
    location /diagrams {
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 11m;
    }
    location /chat {
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Assets hashés → cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Sécurité de base
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
