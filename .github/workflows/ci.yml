# Vérifie chaque PR avant fusion : le code passe ESLint, l'éditeur, la version en
# ligne, le serveur MCP et les deux images Docker se construisent. Aucun secret, rien n'est publié.
# C'est le contrôle à exiger dans la règle de protection de main (Settings > Rules > Rulesets).

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par empreinte de commit, comme dans pages.yml et docker.yml.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:online
      - run: npm ci --omit=dev
        working-directory: mcp
      # Chaque fichier du serveur doit au moins se lire.
      - run: for f in mcp/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Dockerfile
            build-args: VITE_MCP_BRIDGE_URL=/bridge
          - file: mcp/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false
