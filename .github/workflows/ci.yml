# Vérifie chaque PR avant fusion : le code passe ESLint et les tests, l'éditeur, la version en
# ligne, le serveur MCP et les deux images Docker se construisent. Aucun secret, rien n'est publié.
# C'est le contrôle à exiger dans la règle de protection de main (Settings > Rules > Rulesets).
# Il repasse aussi sur main après chaque fusion, pour que le badge CI du README ait un statut.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, chaque fusion garde son run complet : le badge ne montre jamais « cancelled ».
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions épinglées par empreinte de commit, comme dans pages.yml et docker.yml.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      # Dépendances du serveur avant les tests : test/headless.test.mjs relie de vrais WebSocket au pont.
      - run: npm ci --omit=dev
        working-directory: mcp
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:online
      # Chaque fichier du serveur doit au moins se lire.
      - run: for f in mcp/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Dockerfile
            build-args: VITE_MCP_BRIDGE_URL=/bridge
          - file: mcp/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false

  # Navigateur du mode sans écran : construit, lancé avec les réglages de docker-compose.headless.yml
  # (lecture seule, /tmp en mémoire, aucune capacité), puis interrogé par l'interface DevTools.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f renderer/Dockerfile -t bpmn-pilot-renderer:ci .
      - name: Start the renderer and open a page
        run: |
          docker run -d --name renderer -p 127.0.0.1:9222:9222 --read-only --tmpfs /tmp:size=512m \
            --cap-drop ALL --security-opt no-new-privileges:true bpmn-pilot-renderer:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9222/json/version && break; sleep 1; done
          curl -fs -X PUT 'http://127.0.0.1:9222/json/new?about:blank' | tee /tmp/target.json
          grep -q '"id"' /tmp/target.json
          docker exec renderer id -u | grep -qx 1000
          docker exec renderer ls /usr/share/fonts/truetype/liberation | grep -q LiberationSans-Regular.ttf
      - if: failure()
        run: docker logs renderer
