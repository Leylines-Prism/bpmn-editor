# Publie la version en ligne sur GitHub Pages, en deux pages :
#   /      la page stable, construite depuis le dernier tag de version (vX.Y.Z, sans préversion)
#   /dev/  la page de développement, construite depuis main
# Pages ne sert qu'un site par dépôt : chaque lancement reconstruit les deux et les publie ensemble.
# Il part à chaque fusion sur main (la page dev change) et à chaque tag de version (la page stable
# change). Sans aucun tag, la page stable est construite depuis main.
# Limite : Pages repère un déploiement par son commit et garde celui déjà en ligne quand le même
# commit revient. Un tag posé sur le commit que main vient de publier ne change donc rien : la page
# stable resterait sur l'ancienne version. D'où l'ordre décrit dans CONTRIBUTING.md (section Releases) : release sur
# la branche de la PR de montée de version, puis fusion.
#
# La page dev garde ses diagrammes et réglages à part (SITE_CHANNEL=dev, voir vite.config.js),
# n'est pas indexée et ne mesure pas l'audience.
#
# Page dev sur sa propre origine : quand la variable DEV_SITE_URL est réglée (par exemple
# https://dev.example.com/), la page dev est publiée ailleurs, par un autre dépôt qui construit main
# (son propre workflow Pages). Ce workflow ne construit alors plus dev/ : il y pose une redirection vers
# DEV_SITE_URL, et la page stable pointe vers cette adresse. Une origine à part empêche le code de la
# page dev de lire les diagrammes et les clés gardés par la page stable.
#
# Site statique : pas de serveur MCP, pas d'enregistrement serveur. Chaque visiteur garde ses
# diagrammes dans son navigateur et utilise sa propre clé d'API.
#
# Réglages facultatifs, dans Settings > Secrets and variables > Actions (jamais dans le dépôt) :
#   variables : DEV_SITE_URL (adresse de la page dev sur sa propre origine), SITE_URL (origine publique, par défaut celle de Pages), VITE_SITE_HOST, VITE_HOST_LEGAL (mentions légales : nom, adresse et
#               téléphone de l'hébergeur), VITE_FEEDBACK_URL, VITE_CONTACT_URL (passée au build sous le nom CONTACT_URL), BASE_PATH,
#               VITE_UMAMI_URL et VITE_UMAMI_WEBSITE_ID (mesure d'audience, voir src/analytics.js)
#   secret    : FEEDBACK_EMAIL
# Prérequis : Settings > Pages > Source réglé sur « GitHub Actions ».

name: Pages

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Lecture seule par défaut : chaque job reçoit seulement les droits dont il a besoin.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions épinglées par empreinte de commit, comme dans docker.yml : un tag déplacé ne change
# pas le code exécuté. Dependabot propose les mises à jour (.github/dependabot.yml).

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages lit les réglages Pages du dépôt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les tags : la version affichée vient de git describe.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Deux copies de travail : le dernier tag de version (page stable) et main (page dev).
      - id: refs
        run: |
          stable=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          echo "stable=${stable:-origin/main}" >> "$GITHUB_OUTPUT"
          git worktree add --detach build-stable "${stable:-origin/main}"
          git worktree add --detach build-dev origin/main
      # npm ci : exactement les versions du package-lock.json.
      - name: Build the stable page (${{ steps.refs.outputs.stable }})
        working-directory: build-stable
        run: npm ci && npm run build:online
        env:
          # Le site vit à la racine de son domaine (bpmn.leylines.fr). Sans domaine personnalisé,
          # régler la variable BASE_PATH sur /<nom-du-dépôt>/ (configure-pages ne suit pas le domaine).
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          # Origine publique du site, pour l'aperçu des liens partagés (og:image en adresse absolue).
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          VITE_SITE_HOST: ${{ vars.VITE_SITE_HOST || 'GitHub Pages' }}
          VITE_HOST_LEGAL: ${{ vars.VITE_HOST_LEGAL }}
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          # Sans le préfixe VITE_ : le build le chiffre (vite.config.js) au lieu de le laisser en clair.
          CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_OTHER_SITE_URL: ${{ vars.DEV_SITE_URL }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
      # Mêmes réglages, dans le sous-dossier dev/ et sans mesure d'audience.
      - name: Build the development page (main)
        if: ${{ vars.DEV_SITE_URL == '' }}
        working-directory: build-dev
        run: npm ci && npm run build:online
        env:
          SITE_CHANNEL: dev
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}dev/
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          VITE_SITE_HOST: ${{ vars.VITE_SITE_HOST || 'GitHub Pages' }}
          VITE_HOST_LEGAL: ${{ vars.VITE_HOST_LEGAL }}
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
      - name: Put the development page in dev/
        if: ${{ vars.DEV_SITE_URL == '' }}
        run: |
          rm -rf build-stable/dist-online/dev
          cp -R build-dev/dist-online build-stable/dist-online/dev
      # La page dev vit sur sa propre origine : dev/ ne fait plus que rediriger vers elle.
      - name: Redirect dev/ to the development page
        if: ${{ vars.DEV_SITE_URL != '' }}
        env:
          DEV_SITE_URL: ${{ vars.DEV_SITE_URL }}
        run: |
          case "$DEV_SITE_URL" in https://*) ;; *) echo "DEV_SITE_URL must start with https://"; exit 1 ;; esac
          url=$(printf '%s' "$DEV_SITE_URL" | sed 's/[&<>"]//g')
          rm -rf build-stable/dist-online/dev
          mkdir -p build-stable/dist-online/dev
          printf '<!doctype html>\n<meta charset="utf-8">\n<meta name="robots" content="noindex">\n<meta http-equiv="refresh" content="0; url=%s">\n<title>BPMN-Pilot (development)</title>\n<p>The development page has moved: <a href="%s">%s</a></p>\n' "$url" "$url" "$url" > build-stable/dist-online/dev/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build-stable/dist-online

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # publication sur Pages
      id-token: write  # preuve que le déploiement vient de ce workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
