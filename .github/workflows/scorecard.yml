# Analyse OpenSSF Scorecard : note les pratiques de sécurité du dépôt (actions épinglées, droits des
# workflows, protection de main, revue des PR, mises à jour des dépendances...).
# Les résultats partent dans Security > Code scanning et sur api.scorecard.dev, d'où vient le badge
# des README. Repris de l'exemple officiel de ossf/scorecard-action (examples/scorecard.yml).
#
# Le service impose ses règles à ce fichier pour accepter les résultats : aucun droit en écriture au
# niveau du workflow, aucune variable d'environnement globale, seulement les actions de la liste
# approuvée dans ce job, et aucune étape `run`. Voir
# https://github.com/ossf/scorecard-action#workflow-restrictions

name: Scorecard

'on':
  # Pour le contrôle Branch-Protection. Seule la branche par défaut est prise en charge.
  branch_protection_rule:
  # Tient à jour le contrôle Maintained : chaque dimanche.
  schedule:
    - cron: '15 14 * * 0'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
# Interdit tout accès au cache. Clé ajoutée à GitHub Actions en septembre 2026 : certains
# vérificateurs de workflows ne la connaissent pas encore.
cache-mode: none

# Actions épinglées par empreinte de commit, comme dans les autres workflows.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write  # envoi du SARIF dans Code scanning
      id-token: write  # signature des résultats publiés sur api.scorecard.dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true

      # Le SARIF reste cinq jours dans l'onglet Actions, pour le débogage.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ always() }}
        with:
          sarif_file: results.sarif
