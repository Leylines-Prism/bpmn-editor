name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Never paste an API key or a token here**, even a revoked one.
        A security problem goes through the private form instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. Click on ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Online demo
        - Docker images
        - From the source code (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (for example 1.1.0) or the commit, if you know it.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: AI assistant or MCP involved?
      options:
        - "No"
        - Built-in assistant (Anthropic)
        - Built-in assistant (OpenAI)
        - Built-in assistant (Ollama or another provider)
        - An agent through MCP
  - type: textarea
    id: extra
    attributes:
      label: Console errors, screenshots, BPMN file
      description: Browser console errors (F12) help a lot. You can drop a screenshot or a .bpmn file here, without anything confidential in it.
